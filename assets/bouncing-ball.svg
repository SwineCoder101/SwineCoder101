<svg xmlns="http://www.w3.org/2000/svg" width="260" height="120" viewBox="0 0 260 120" role="img" aria-label="A bouncing green ball">
  <defs>
    <radialGradient id="ball" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#a7f3c4"/>
      <stop offset="55%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
  </defs>
  <line x1="8" y1="105" x2="252" y2="105" stroke="#22c55e" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="26,0;234,0;26,0" keyTimes="0;0.5;1" dur="5.4s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
    <ellipse cx="0" cy="105" rx="16" ry="3.5" fill="#22c55e" opacity="0.28">
      <animate attributeName="rx" values="17;9;9;9;17" keyTimes="0;0.14;0.5;0.86;1" dur="0.9s" calcMode="spline" keySplines="0 0 0.4 1;0 0 1 1;0.6 0 1 1;0 0 1 1" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.12;0.12;0.12;0.3" keyTimes="0;0.14;0.5;0.86;1" dur="0.9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="91" rx="14" ry="14" fill="url(#ball)">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-62;0,0" keyTimes="0;0.5;1" dur="0.9s" calcMode="spline" keySplines="0.1 0 0.4 1;0.6 0 0.9 1" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="ry" values="10.5;14;14;14;10.5" keyTimes="0;0.12;0.5;0.88;1" dur="0.9s" calcMode="spline" keySplines="0 0 0.4 1;0 0 1 1;0.6 0 1 1;0 0 1 1" repeatCount="indefinite"/>
      <animate attributeName="rx" values="17;14;14;14;17" keyTimes="0;0.12;0.5;0.88;1" dur="0.9s" calcMode="spline" keySplines="0 0 0.4 1;0 0 1 1;0.6 0 1 1;0 0 1 1" repeatCount="indefinite"/>
      <animate attributeName="cy" values="94.5;91;91;91;94.5" keyTimes="0;0.12;0.5;0.88;1" dur="0.9s" calcMode="spline" keySplines="0 0 0.4 1;0 0 1 1;0.6 0 1 1;0 0 1 1" repeatCount="indefinite"/>
    </ellipse>
